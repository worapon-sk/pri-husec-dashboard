<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 font-sans text-slate-800">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200">
    <h2 class="text-xl font-bold text-purple-700 mb-4 border-b pb-2 flex items-center">
      <span class="w-7 h-7 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center text-sm mr-2">ศ</span> 
      บันทึกรับแจ้งเคสใหม่ (ศรส. ปราจีนบุรี)
    </h2>
    
    <form id="caseForm" onsubmit="handleFormSubmit(event)" class="space-y-4 text-sm">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">ช่องทางการรับเรื่อง:</label>
          <select name="channel" required class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-purple-500 outline-none">
            <option value="1300">1300</option>
            <option value="ESS Help Me">ESS Help Me</option>
            <option value="รับเรื่องที่ พมจ.">รับเรื่องที่ พมจ.</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">กลุ่มเป้าหมาย:</label>
          <select name="targetGroup" required class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-purple-500 outline-none">
            <option value="สตรี">สตรี</option>
            <option value="เด็กและเยาวชน">เด็กและเยาวชน</option>
            <option value="ผู้สูงอายุ">ผู้สูงอายุ</option>
            <option value="คนพิการ">คนพิการ</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">ระดับความเร่งด่วน:</label>
          <select name="priorityLevel" required class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-purple-500 outline-none">
            <option value="ด่วนที่สุด (แดง)">ด่วนที่สุด (แดง)</option>
            <option value="ด่วน (เหลือง)">ด่วน (เหลือง)</option>
            <option value="ปกติ (เขียว)">ปกติ (เขียว)</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1">เหตุวิกฤต 5 ด้าน ศรส.:</label>
          <select name="criticalType" required class="w-full rounded-lg border border-slate-300 p-2.5 focus:ring-2 focus:ring-purple-500 outline-none">
            <option value="ข่มขู่/ทำร้ายร่างกาย">ข่มขู่/ทำร้ายร่างกาย</option>
            <option value="Bully / รังแก">Bully / รังแก</option>
            <option value="ผู้ป่วยจิตเวช/ยาเสพติด/วิกฤตสังคม">ผู้ป่วยจิตเวช/ยาเสพติด/วิกฤตสังคม</option>
            <option value="ถูกละเมิดทางเพศ">ถูกละเมิดทางเพศ</option>
            <option value="กักขังหน่วงเหนี่ยว">กักขังหน่วงเหนี่ยว</option>
          </select>
        </div>
      </div>

      <div class="border-t pt-4">
        <h3 class="font-bold text-slate-800 mb-3 text-base">ข้อมูลผู้ประสบปัญหา</h3>
        <div class="grid grid-cols-2 gap-4 mb-3">
          <div>
            <label class="block text-slate-600 mb-1">ชื่อ-นามสกุล:</label>
            <input type="text" name="victimName" required class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500">
          </div>
          <div>
            <label class="block text-slate-600 mb-1">เลขบัตรประชาชน (13 หลัก):</label>
            <input type="text" name="idCard" maxlength="13" required class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500">
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-slate-600 mb-1">อายุ (ปี):</label>
            <input type="number" name="age" required class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500">
          </div>
          <div>
            <label class="block text-slate-600 mb-1">เพศ:</label>
            <select name="gender" class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500">
              <option value="ชาย">ชาย</option>
              <option value="หญิง">หญิง</option>
              <option value="อื่นๆ">อื่นๆ</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1">เบอร์โทรศัพท์:</label>
            <input type="text" name="phone" required class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500">
          </div>
        </div>
      </div>

      <div class="border-t pt-4">
        <h3 class="font-bold text-slate-800 mb-3 text-base">สถานที่และรายละเอียดเหตุการณ์</h3>
        <div class="grid grid-cols-2 gap-4 mb-3">
          <div>
            <label class="block text-slate-600 mb-1">อำเภอ:</label>
            <select name="district" required class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500">
              <option value="เมืองปราจีนบุรี">เมืองปราจีนบุรี</option>
              <option value="กบินทร์บุรี">กบินทร์บุรี</option>
              <option value="นาดี">นาดี</option>
              <option value="ศรีมหาโพธิ">ศรีมหาโพธิ</option>
              <option value="ประจันตคาม">ประจันตคาม</option>
              <option value="บ้านสร้าง">บ้านสร้าง</option>
              <option value="ศรีมโหสถ">ศรีมโหสถ</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-600 mb-1">ตำบล:</label>
            <input type="text" name="subDistrict" required class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500">
          </div>
        </div>
        <div class="mb-3">
          <label class="block text-slate-600 mb-1">รายละเอียดสถานที่เกิดเหตุ:</label>
          <input type="text" name="locationDetails" placeholder="เช่น หมู่บ้าน, ถนน, จุดสังเกต" class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500">
        </div>
        <div>
          <label class="block text-slate-600 mb-1">รายละเอียดพฤติการณ์เหตุการณ์:</label>
          <textarea name="incidentDetails" rows="2" placeholder="อธิบายเหตุการณ์คร่าวๆ..." class="w-full rounded-lg border border-slate-300 p-2.5 outline-none focus:ring-2 focus:ring-purple-500"></textarea>
        </div>
      </div>

      <div class="mt-6 flex justify-end space-x-3 pt-3 border-t">
        <button type="button" onclick="google.script.host.close()" class="bg-slate-200 text-slate-700 px-5 py-2.5 rounded-lg hover:bg-slate-300 font-medium">ปิด</button>
        <button type="submit" id="submitBtn" class="bg-purple-600 text-white px-6 py-2.5 rounded-lg hover:bg-purple-700 font-medium shadow-sm">บันทึกข้อมูล</button>
      </div>
    </form>
  </div>

  <script>
    function handleFormSubmit(event) {
      event.preventDefault();
      var btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      var formObject = {};
      var formData = new FormData(event.target);
      formData.forEach((value, key) => { formObject[key] = value; });

      google.script.run
        .withSuccessHandler(function(response) {
          alert(response);
          google.script.host.close();
        })
        .withFailureHandler(function(error) {
          alert('เกิดข้อผิดพลาด: ' + error.message);
          btn.disabled = false;
          btn.innerText = 'บันทึกข้อมูล';
        })
        .saveCaseData(formObject);
    }
  </script>
</body>
</html>
